<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Crie sua conta Mega Store." />
    <title>Criar conta | Mega Store</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/produtos.js"></script>
    <script defer src="js/script.js"></script>
    <script defer src="js/login.js"></script>
  </head>
  <body data-page="cadastro">
    <div data-site-header></div>
    <main class="auth-wrap">
      <section class="auth-panel">
        <span class="eyebrow auth-eyebrow">Faça parte</span>
        <h1>Criar conta</h1>
        <p>Uma experiência feita para você.</p>
        <form id="register-form">
          <div class="form-field">
            <label for="nome">Nome</label
            ><input
              id="nome"
              name="nome"
              type="text"
              autocomplete="name"
              required
            />
          </div>
          <div class="form-field">
            <label for="email">E-mail</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-field">
            <label for="senha">Senha</label
            ><input
              id="senha"
              name="senha"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <div class="form-field">
            <label for="confirmacao">Confirmar senha</label
            ><input
              id="confirmacao"
              name="confirmacao"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <button class="button button-dark" type="submit">Criar conta</button>
          <p class="form-message" aria-live="polite"></p>
        </form>
        <p class="auth-alternative">
          Já tem uma conta? <a href="login.html">Entrar</a>
        </p>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
</html>
